<g class="a-bubble"><g transform="translate(-64,-40)"><path d="M196,206 h138 a52,52 0 0 1 52,52 v4 a52,52 0 0 1 -52,52 h-12 l28,48 l-88,-48 h-66 a52,52 0 0 1 -52,-52 v-4 a52,52 0 0 1 52,-52 Z" fill="#FEF0C0" stroke="#2A0804" stroke-width="12" stroke-linejoin="round"/><circle class="dot d0" cx="216" cy="260" r="13" fill="#8B3218"/><circle class="dot d1" cx="265" cy="260" r="13" fill="#8B3218"/><circle class="dot d2" cx="314" cy="260" r="13" fill="#8B3218"/></g></g>
