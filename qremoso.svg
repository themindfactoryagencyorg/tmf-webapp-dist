<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
<title>Qremoso, el agente de Qrema</title>
<style>
.a-t1,.a-t2,.a-t3,.a-tip{transform-box:fill-box;transform-origin:50% 100%}
.a-t3{animation:rise .75s cubic-bezier(.3,.7,.4,1) both}
.a-t2{animation:rise .75s cubic-bezier(.3,.7,.4,1) .18s both}
.a-t1{animation:rise .75s cubic-bezier(.3,.7,.4,1) .36s both}
.a-tip{animation:tipin .8s cubic-bezier(.3,.7,.4,1) .54s both}
.face{animation:fade .35s ease-out .6s both}
.a-bubble{transform-box:fill-box;transform-origin:85% 100%;animation:pop .55s cubic-bezier(.3,1.4,.5,1) 1.05s both}
.a-s1,.a-s2,.twinkle,.dot,.wink,.blink{transform-box:fill-box;transform-origin:50% 50%}
.a-s1{animation:starin .6s cubic-bezier(.3,1.4,.5,1) 1.25s both}
.a-s2{animation:starin .6s cubic-bezier(.3,1.4,.5,1) 1.4s both}
.breath{transform-box:view-box;transform-origin:512px 640px;animation:breathe 4.2s ease-in-out 1.6s infinite}
.sway{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out 1.6s infinite}
.wink{animation:wink .55s ease-in-out 1.75s both}
.blink{animation:blink 6.5s ease-in-out 3.2s infinite}
.twinkle{animation:twinkle 2.6s ease-in-out 2s infinite alternate}
.t-b{animation-delay:2.7s}
.dot{animation:dot 1.5s ease-in-out 1.8s infinite}
.d1{animation-delay:2s}.d2{animation-delay:2.2s}
@keyframes rise{0%{opacity:0;transform:translateY(150px) scale(.6,.4)}60%{opacity:1;transform:translateY(-14px) scale(1.04,1.07)}100%{opacity:1;transform:none}}
@keyframes tipin{0%{opacity:0;transform:scale(.2) rotate(-25deg)}60%{opacity:1;transform:scale(1.08) rotate(6deg)}100%{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{opacity:0;transform:scale(0)}100%{opacity:1;transform:none}}
@keyframes starin{0%{opacity:0;transform:scale(0) rotate(-90deg)}100%{opacity:1;transform:none}}
@keyframes breathe{0%,100%{transform:none}50%{transform:scale(.99,1.03)}}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(2.5deg)}}
@keyframes wink{0%,100%{transform:scaleY(1)}40%,60%{transform:scaleY(.08)}}
@keyframes blink{0%,28%,33%,70%,75%,81%,100%{transform:scaleY(1)}30.5%,72.5%,78%{transform:scaleY(.08)}}
@keyframes twinkle{from{transform:scale(1) rotate(0);opacity:1}to{transform:scale(.82) rotate(14deg);opacity:.75}}
@keyframes dot{0%,60%,100%{transform:scale(1)}30%{transform:scale(1.45)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<ellipse cx="512" cy="912" rx="260" ry="28" fill="#2A0804" opacity="0.12"/>
